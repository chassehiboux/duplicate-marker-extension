# Фрагмент /etc/haproxy/haproxy.cfg на VPS.
# Правило добавлено в frontend public_ssl до default_backend.
use_backend supabase_proxy_backend if { req_ssl_sni -i sb.jassco.ru }

# Отдельный TCP backend передаёт TLS в Nginx.
backend supabase_proxy_backend
    mode tcp
    timeout server 1h
    server supabase_proxy_nginx 127.0.0.1:8447 check
