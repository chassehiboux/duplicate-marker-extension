# Устанавливается на VPS как /etc/nginx/sites-available/sb.jassco.ru.
server {
    listen 80;
    listen [::]:80;
    server_name sb.jassco.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8447 ssl http2;
    server_name sb.jassco.ru;

    ssl_certificate /etc/letsencrypt/live/sb.jassco.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sb.jassco.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location ^~ /realtime/v1/ {
        proxy_pass https://odljanxhmjysnduylvxz.supabase.co;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name odljanxhmjysnduylvxz.supabase.co;
        proxy_set_header Host odljanxhmjysnduylvxz.supabase.co;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass https://odljanxhmjysnduylvxz.supabase.co;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name odljanxhmjysnduylvxz.supabase.co;
        proxy_set_header Host odljanxhmjysnduylvxz.supabase.co;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
