    $(function() {
      $('form .dateinfo').bind('keyup', function() {
          var isEmptyValue = this.value.replace(/[_.]/g, '') === '';
          if ((isEmptyValue && !this.required) || moment(this.value, 'DD.MM.YYYY', true).isValid()){
            this.setCustomValidity('')
          } else {
            this.setCustomValidity('Укажите корректную дату')
          }
          Ladda.stopAll()
      })
      
      $('form:has(.dateinfo)').bind('submit', function (e) {
        if (!this.reportValidity()) {
          e.preventDefault()
          return false
        }
      })
    });
    
    function showBootstrapAlert(form, bootstrapType, messageHtml) {
      const container = document.createElement('div')
      container.className = 'alert alert-' + bootstrapType
      container.innerHTML =
        '<button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>'
        + messageHtml
        
      form.insertBefore(container, form.firstChild)
    }

    $(function() {
      $('form[data-message-success]').bind('submit', function(event) {
        event.preventDefault()
        const form = event.target
        const successMessage = event.target.dataset.messageSuccess

        downloadAsync({
          method: event.target.method,
          url:    event.target.action,
          data:   new FormData(event.target),

          success: function() {
            if (Ladda) {
              Ladda.stopAll()
            }
            
            showBootstrapAlert(form, 'success', successMessage)
          },

          fail: function(result) {
            if (Ladda) {
              Ladda.stopAll()
            }
            
            if(result.error) {
                showBootstrapAlert(form, 'danger', '<strong>Ошибка:</strong> '+ result.message)
            } else if (result.errors) {
                for(const i in result.errors) {
                    showBootstrapAlert(form, 'danger', '<strong>Ошибка:</strong> '+ result.errors[i])
                }
            } else {
                showBootstrapAlert(form, 'warning', result.message)
            }
          }
        })
      })
    })

    function claimantSelector($item,complete, first, bankValue) {
        $.post('/bus/ronn/getBankClaimants', { //TODO::дописать запрос
            Bank: bankValue
        }, function (result_data) {
            if (result_data.length!=0) {
                complete=false;
                if (first[0] == true) {
                    $($item).append('<select id="ClaimantID" class="form-control" style=" margin-top: 10px; height: 34px; width: 300px;" name="ClaimantID" required></select>')
                    first[0] = false;
                }
                else {
                    $('#ClaimantID').empty()
                }
                $main = $('#ClaimantID');
                $($main).append('<option value="-1">--выберите взыскателя--</option>')
                for (var key in result_data) {
                    $($main).append('<option value="' + result_data[key]['ClaimantName'] + '">' + result_data[key]['ClaimantName'] + '</option>');
                }

                complete = true;
                $("#ClaimantID").on('change', function () {
                    $.post('/bus/ronn/getBankNumbers', {
                        Claimant: $("#ClaimantID").val(),
                        Bank: bankValue
                    }, function (result_data) {
                        console.log(result_data)
                        if (result_data.length!=0) {
                            if (complete) {
                                complete = false;
                                if (first[1]) {
                                    $($main).after('<select id="BankAccountID" class="form-control" style=" margin-top: 10px; height: 34px; width: 300px;" name="BankAccountID" required></select>')
                                    first[1] = false;
                                }
                                else {
                                    $('#BankAccountID').empty()
                                }
                                $main = $('#BankAccountID');
                                $($main).append('<option value="-1">--выберите счет--</option>')
                                for (var key in result_data) {
                                    ($main).append('<option value="' + result_data[key]['BankAccountID'] + '">' + result_data[key]['BankAccountNumber'] + '</option>');
                                }
                                complete = true;
                            }
                        }

                    })

                });
            }
            else
            {
                $('#ClaimantID').remove();
                $('#BankAccountID').remove();
                first[0] = true;
                first[1] = true;

            }

        });

    }

    /**
     * Flash уведомления
     *
     * @param  {Object} $jQueryForm
     * @param  {string} message
     * @param  {string} className
     */
    function flash($jQueryForm, message, className='success') {
        $jQueryForm.prepend(`<div class="alert alert-${className} alert-dismissible" role="alert">
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">×</span></button>
        ${message}</div>`)
    }

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const workResult = document.getElementById('WorkResult');
            const successBlock = document.getElementById('successBlock');
            const rejectedBlock = document.getElementById('rejectedBlock');
            const claimantInputs = document.querySelectorAll('.claimant-amount');
            const totalSumInput = document.getElementById('totalSum');
            const rejectionReason = document.getElementById('rejectionReason');
            const form = document.getElementById('reversalForm');
            const clearBtn = document.getElementById('clearBtn');

            // Функция переключения видимости блоков
            function toggleBlocks() {
                const value = workResult.value;
                if (value === '1') {
                    successBlock.style.display = 'block';
                    rejectedBlock.style.display = 'none';
                    claimantInputs.forEach(input => {
                        input.setAttribute('required', 'required');
                        input.removeAttribute('disabled');
                    });
                    document.getElementById('rejectionReason').removeAttribute('required');
                    if (rejectionReason) {
                        rejectionReason.value = null;
                    }
                } else if (value === '0') {
                    successBlock.style.display = 'none';
                    rejectedBlock.style.display = 'block';
                    claimantInputs.forEach(input => {
                        input.removeAttribute('required');
                        input.setAttribute('disabled', 'disabled');
                        input.value = '';
                    });
                    document.getElementById('rejectionReason').setAttribute('required', 'required');
                    if (totalSumInput) {
                        totalSumInput.value = null;
                    }
                } else {
                    successBlock.style.display = 'none';
                    rejectedBlock.style.display = 'none';
                    claimantInputs.forEach(input => {
                        input.removeAttribute('required');
                        input.removeAttribute('disabled');
                        input.value = '';
                    });
                    document.getElementById('rejectionReason').removeAttribute('required');
                    rejectionReason.value = null;
                    totalSumInput.value = null;
                }
            }

            // Подсчёт общей суммы
            function calculateTotal() {
                let total = 0;
                claimantInputs.forEach(input => {
                    const val = parseFloat(input.value) || 0;
                    total += val;
                });
                totalSumInput.value = total.toFixed(2);
            }

            // Очистка информации
            function handleClear() {
                if (confirm('Вы уверены, что хотите очистить всю информацию?')) {
                    // Создаём скрытое поле для параметра clear
                    const clearInput = document.createElement('input');
                    clearInput.type = 'hidden';
                    clearInput.name = 'clear';
                    clearInput.value = '1';
                    form.appendChild(clearInput);

                    // Отправляем форму
                    form.submit();
                }
            }

            // События
            workResult.addEventListener('change', toggleBlocks);
            claimantInputs.forEach(input => {
                input.addEventListener('input', calculateTotal);
            });

            if (clearBtn) {
                clearBtn.addEventListener('click', handleClear);
            }

            // Инициализация при загрузке
            toggleBlocks();
            calculateTotal();
        });
    </script>

  </div>
  

</body></html>
