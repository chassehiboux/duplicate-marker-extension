<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вложение · Проверка списания</title>
  <link rel="stylesheet" href="reestr_dz_pdf_viewer.css">
  <script defer src="extension_ui_config.js"></script>
  <script defer src="content.js"></script>
  <script defer src="reestr_dz_pdf_viewer.js"></script>
</head>
<body>
  <main class="pdf-stage">
    <iframe class="pdf-frame" data-role="pdf-frame" title="PDF-вложение" hidden></iframe>
    <div data-role="archive-pdfs" hidden></div>
    <section class="pdf-status" data-role="status" aria-live="polite">
      <div class="pdf-spinner" data-role="spinner" aria-hidden="true"></div>
      <div class="pdf-kicker">Проверка списания</div>
      <h1 data-role="file-name">Вложение</h1>
      <p data-role="message">Получаю файл из WSS…</p>
      <div class="pdf-progress" data-role="progress" hidden>
        <div class="pdf-progress-track" role="progressbar" aria-label="Прогресс обработки" aria-valuemin="0" aria-valuemax="100">
          <span data-role="progress-bar"></span>
        </div>
        <small data-role="progress-text"></small>
      </div>
      <button type="button" data-action="retry" hidden>Повторить</button>
    </section>
  </main>
</body>
</html>
